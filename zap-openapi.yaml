
openapi: 3.0.3
info:
  title: Simple Spring Boot CRUD API
  version: 1.0.0
  description: API definition for authorized OWASP ZAP security testing

servers:
  - url: http://localhost:8080

tags:
  - name: Authentication
  - name: Users

paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Invalid request

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
        '400':
          description: Invalid request

  /api/users:
    get:
      tags:
        - Users
      summary: Get users with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: User list
        '401':
          description: Unauthorized
      security:
        - BearerAuth: []

    post:
      tags:
        - Users
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      security:
        - BearerAuth: []

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Users
      summary: Get user by ID
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
        - BearerAuth: []

    put:
      tags:
        - Users
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '200':
          description: User updated
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      security:
        - BearerAuth: []

    delete:
      tags:
        - Users
      summary: Delete user
      responses:
        '200':
          description: User deleted
        '401':
          description: Unauthorized
      security:
        - BearerAuth: []

  /api/users/email/{email}:
    get:
      tags:
        - Users
      summary: Get user by email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
        - BearerAuth: []

  /api/users/search:
    get:
      tags:
        - Users
      summary: Search users
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search results
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      security:
        - BearerAuth: []

  /api/users/health:
    get:
      tags:
        - Users
      summary: Health check
      security: []
      responses:
        '200':
          description: Service health

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 64

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 64

    UserCreateRequest:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'

    UserDTO:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
